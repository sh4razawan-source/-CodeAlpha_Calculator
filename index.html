<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="screen" aria-live="polite">
      <div class="expr" id="expr"></div>
      <div class="value" id="value">0</div>
    </div>
    <div class="keys">
      <button data-action="clear" class="fn">C</button>
      <button data-action="back" class="fn" aria-label="Backspace">&#9003;</button>
      <button data-action="percent" class="fn">%</button>
      <button data-op="/" class="op" aria-label="Divide">&divide;</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="*" class="op" aria-label="Multiply">&times;</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-" class="op" aria-label="Subtract">&minus;</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op" aria-label="Add">+</button>

      <button data-num="0" class="zero">0</button>
      <button data-action="dot">.</button>
      <button data-action="equals" class="eq" aria-label="Equals">=</button>
    </div>
    <p class="hint">Keyboard: 0-9, + - * /, Enter, Backspace, Esc</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
